    - '#/paths/~1rates/post/operationId'
    - '#/paths/~1services/get/operationId'
    - '#/paths/~1labels~1{orderId}/get/operationId'
    - '#/paths/~1orders/post/operationId'
    - '#/paths/~1returns/get/operationId'
    - '#/paths/~1returns/post/operationId'
