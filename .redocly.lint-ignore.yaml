    - '#/paths/~1users~1service/post/security/0/Oauth2'
    - '#/paths/~1rates/post/security/0/Oauth2'
    - '#/paths/~1labels~1{orderId}/get/security/0/Oauth2'
    - '#/paths/~1oauth~1token/post'
